<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f5f3ed">
    <title>{% block title %}합격자 조회{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 바로가기</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ url_for('login') }}" aria-label="합격자 조회 홈">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M5.6 18.4 18.4 5.6"/>
              <path d="m12 3 1.5 4.5M12 3l-1.5 4.5M21 12l-4.5 1.5M21 12l-4.5-1.5M12 21l-1.5-4.5M12 21l1.5-4.5M3 12l4.5-1.5M3 12l4.5 1.5"/>
            </svg>
          </span>
          합격자 조회
        </a>
        {% block header_actions %}<span class="header-caption">A NEW CHAPTER BEGINS</span>{% endblock %}
      </header>
      <main id="main-content" class="main-content" tabindex="-1">
        {% block content %}{% endblock %}
      </main>
      <footer class="site-footer">당신의 새로운 시작을 응원합니다.</footer>
    </div>
  </body>
</html>
