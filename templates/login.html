{% extends "base.html" %}
{% block title %}로그인 · 나의 공간{% endblock %}
{% block content %}
<section class="login-layout" aria-labelledby="login-title">
  <div class="intro">
    <span class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>오직 나를 위한 작은 공간</span>
    <h1 id="login-title">나의 이야기를 만나는 시간<span class="accent-dot">.</span></h1>
    <p class="intro-description">분주한 하루를 잠시 내려놓고,<br>소중한 이야기가 있는 곳으로 들어오세요.</p>
  </div>

  <div class="login-card">
    <div class="card-heading">
      <span class="card-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M8 10V7a4 4 0 0 1 8 0v3M7 10h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"/>
          <path d="M12 14v3"/>
        </svg>
      </span>
      <h2>반가워요, 어서 오세요</h2>
      <p>아이디와 비밀번호를 입력해 주세요.</p>
    </div>

    {% if error %}
    <div id="login-error" class="error-message" role="alert">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4.5M10 13.5v.1"/></svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form class="login-form" method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-field">
        <label for="username">아이디</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-1a7 7 0 0 1 14 0v1"/></svg>
          <input id="username" name="username" type="text" value="{{ username | default('') }}" placeholder="아이디를 입력해 주세요" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="100" required{% if error %} aria-describedby="login-error"{% endif %}>
        </div>
      </div>
      <div class="form-field">
        <label for="password">비밀번호</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
          <input id="password" name="password" type="password" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" maxlength="1024" required{% if error %} aria-describedby="login-error"{% endif %}>
        </div>
      </div>
      <button class="button button-primary" type="submit">
        나의 공간으로 들어가기
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <p class="card-note">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m10 2 6 2.5V10c0 4-6 7.5-6 7.5S4 14 4 10V4.5L10 2Z"/><path d="m7.5 9.5 1.75 1.75L13 7.5"/></svg>
      로그인한 뒤에만 이야기를 볼 수 있어요.
    </p>
  </div>
</section>
{% endblock %}
